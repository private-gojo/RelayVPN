name: UDPGW Capacity

on:
  workflow_dispatch:
    inputs:
      max_clients:
        description: Maximum concurrent UDPGW TCP sessions
        required: true
        type: choice
        default: '10000'
        options:
          - '10000'
          - '25000'
          - '50000'
          - '100000'
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  capacity:
    name: UDPGW adaptive capacity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_CLIENTS: ${{ inputs.max_clients || '10000' }}
    steps:
      - name: Checkout RelayVPN
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build BadVPN UDPGW
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/relayvpn-capacity-build" \
            -G "Unix Makefiles" \
            -DBUILD_NOTHING_BY_DEFAULT=ON \
            -DBUILD_UDPGW=ON
          cmake --build "$RUNNER_TEMP/relayvpn-capacity-build" \
            --target badvpn-udpgw --parallel 2

      - name: Run adaptive capacity measurement
        run: |
          set -euo pipefail
          GO111MODULE=off go test -race ./tests/udpgw-capacity
          go run ./tests/udpgw-capacity/main.go \
            --binary "$RUNNER_TEMP/relayvpn-capacity-build/udpgw/badvpn-udpgw" \
            --max-clients "$MAX_CLIENTS" \
            --hold 2s \
            --report "$RUNNER_TEMP/udpgw-capacity.json"

      - name: Upload capacity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udpgw-capacity-${{ github.run_number }}
          path: ${{ runner.temp }}/udpgw-capacity.json
          if-no-files-found: warn
          retention-days: 30
