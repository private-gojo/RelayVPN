name: WP6 - Hev UDP session and PCB boundaries

on:
  push:
    branches:
      - phase-wp6/hev-udp-boundary-measurement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hev-udp-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout RelayVPN
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake iproute2 iputils-ping python3
          sudo modprobe tun || true
          test -c /dev/net/tun
          ulimit -n 65535

      - name: Verify network namespace support
        run: |
          set -euo pipefail
          sudo ip netns add rvchk
          sudo ip netns del rvchk
          sudo ip link add rvchk type dummy
          sudo ip link del rvchk

      - name: Build standalone Hev executable
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/relayvpn-wp6-hev-build" \
            -G "Unix Makefiles" \
            -DBUILD_HEV=ON \
            -DBUILD_TUN2SOCKS=OFF \
            -DBUILD_CLIENT=OFF \
            -DBUILD_SERVER=OFF \
            -DBUILD_FLOODER=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_NCD=OFF \
            -DBUILD_UDPGW=OFF \
            -DBUILD_DOSTEST=OFF
          CFLAGS="-DHEV_WP6_BOUNDARY_TEST" cmake --build "$RUNNER_TEMP/relayvpn-wp6-hev-build" --target hev-bin --parallel 2
          test -x third_party/hev-socks5-tunnel/bin/hev-socks5-tunnel

      - name: Record Hev lwIP allocator configuration
        shell: bash
        run: |
          set -euo pipefail
          HEV_LWIP="third_party/hev-socks5-tunnel/third-part/lwip/src"
          echo "CFLAGS environment: ${CFLAGS:-<unset>}"
          printf '#include <lwip/opt.h>\n' | gcc ${CFLAGS:-} -I"$HEV_LWIP/include" -I"$HEV_LWIP/ports/include" -dM -E -x c - | grep -E '^#define (MEMP_MEM_MALLOC|MEMP_NUM_UDP_PCB|LWIP_UDP) '
          grep -n "lwipopts.h" third_party/hev-socks5-tunnel/third-part/lwip/build/core/udp.dep || true

      - name: Run session-count, UDP PCB, and per-session queue boundary measurements
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wp6-hev"
          HEV_BIN="$GITHUB_WORKSPACE/third_party/hev-socks5-tunnel/bin/hev-socks5-tunnel"
          CLIENT="$GITHUB_WORKSPACE/tests/hev-udp-boundary-client.py"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/phase-wp6-hev-artifacts"
          mkdir -p "$ROOT/logs" "$ARTIFACT_DIR"
          ulimit -n 65535

          HEV_PID=""
          PROXY_PID=""
          FAILURES=()

          cleanup() {
            set +e
            if [[ -n "$HEV_PID" ]] && sudo kill -0 "$HEV_PID" 2>/dev/null; then
              sudo kill -TERM "$HEV_PID" 2>/dev/null
              wait "$HEV_PID" 2>/dev/null
            fi
            if [[ -n "$PROXY_PID" ]] && kill -0 "$PROXY_PID" 2>/dev/null; then
              kill "$PROXY_PID" 2>/dev/null
              wait "$PROXY_PID" 2>/dev/null
            fi
            cp -a "$ROOT/logs/." "$ARTIFACT_DIR/" 2>/dev/null
            sudo ip link del veth-root 2>/dev/null
            sudo ip addr del 198.51.100.10/32 dev lo 2>/dev/null
            sudo ip netns del cli 2>/dev/null
          }
          trap cleanup EXIT

          sudo ip netns add cli
          sudo ip link add veth-root type veth peer name veth-cli
          sudo ip link set veth-cli netns cli
          sudo ip addr add 10.200.0.1/30 dev veth-root
          sudo ip link set veth-root up
          sudo ip -n cli addr add 10.200.0.2/30 dev veth-cli
          sudo ip -n cli link set lo up
          sudo ip -n cli link set veth-cli up
          sudo ip addr add 198.51.100.10/32 dev lo

          HEV_BOUNDARY_PROXY_HOST=10.200.0.1 \
            python3 tests/hev-udp-boundary-proxy.py > "$ROOT/logs/proxy.log" 2>&1 &
          PROXY_PID=$!

          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/10.200.0.1/1080' 2>/dev/null && \
               timeout 1 bash -c '</dev/tcp/10.200.0.1/1082' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$PROXY_PID"
          ss -lnt | grep -E '10.200.0.1:(1080|1082)'
          ss -lnu | grep '10.200.0.1:1081'

          run_case() {
            local label="$1"
            local limit="$2"
            local flows="$3"
            local expected="$4"
            local packets_per_flow="${5:-1}"
            local pause_ms="${6:-0}"
            local send_batch_size="${7:-64}"
            local send_batch_delay_ms="${8:-50}"
            local udp_copy_buffer_nums="${9:-10}"
            local mtu="${10:-1500}"
            local payload_size="${11:-12}"
            local expected_proxy_records="${12:-$expected}"
            local wait_target="${13:-$expected}"
            local config="$ROOT/$label.yml"

            echo "--- $label: max-session-count=$limit flows=$flows expected=$expected ---"
            cat > "$config" <<EOF
          tunnel:
            name: tun0
            mtu: $mtu
            ipv4: 198.18.0.1
            icmp: 'off'
          socks5:
            address: 10.200.0.1
            port: 1080
            udp: 'udp'
          misc:
            log-file: stderr
            log-level: info
            connect-timeout: 10000
            udp-read-write-timeout: 120000
            udp-copy-buffer-nums: $udp_copy_buffer_nums
            max-session-count: $limit
            limit-nofile: 65535
          EOF

            sudo bash -c 'ulimit -n 65535; exec ip netns exec cli "$1" "$2"' \
              _ "$HEV_BIN" "$config" > "$ROOT/logs/$label-hev.log" 2>&1 &
            HEV_PID=$!

            for i in $(seq 1 45); do
              if sudo ip -n cli link show tun0 >/dev/null 2>&1; then
                break
              fi
              if ! sudo kill -0 "$HEV_PID" 2>/dev/null; then
                cat "$ROOT/logs/$label-hev.log"
                return 1
              fi
              sleep 1
            done

            sudo ip -n cli link show tun0
            sudo ip -n cli link set tun0 up
            sudo ip -n cli route replace default dev tun0

            if sudo bash -c 'ulimit -n 65535; exec ip netns exec cli python3 "$@"' \
              _ "$CLIENT" --flows "$flows" --expected "$expected" \
              --packets-per-flow "$packets_per_flow" \
              --payload-size "$payload_size" \
              --expected-proxy-records "$expected_proxy_records" \
              --wait-target "$wait_target" --timeout-ms 45000 \
              --settle-ms 2000 --response-seconds 6 \
              --send-batch-size "$send_batch_size" \
              --send-batch-delay-ms "$send_batch_delay_ms"; then
              echo "$label client_status=0"
            else
              local client_status=$?
              echo "$label client_status=$client_status"
              FAILURES+=("$label client status $client_status")
            fi
            sudo ip -n cli -s link show tun0 || true

            tail -n 100 "$ROOT/logs/$label-hev.log" || true
            if sudo kill -0 "$HEV_PID" 2>/dev/null; then
              sudo kill -TERM "$HEV_PID" 2>/dev/null || true
            else
              echo "$label: Hev exited before shutdown request"
            fi
            set +e
            wait "$HEV_PID"
            local status=$?
            set -e
            echo "$label hev_exit_status=$status"
            if [[ "$status" -ne 0 ]]; then
              FAILURES+=("$label Hev exit status $status")
            fi
            HEV_PID=""

            for i in $(seq 1 20); do
              if ! sudo ip -n cli link show tun0 >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            if sudo ip -n cli link show tun0 >/dev/null 2>&1; then
              echo "tun0 still exists after $label" >&2
              FAILURES+=("$label TUN cleanup failed")
            fi

            echo "- $label: expected $expected responders from $flows flows (max-session-count=$limit)" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          check_invalid_udp_copy_buffer_count() {
            local value="$1"
            local label="udp-copy-buffer-invalid-$value"
            local config="$ROOT/$label.yml"
            local log="$ROOT/logs/$label-hev.log"
            local status

            cat > "$config" <<EOF
          misc:
            udp-copy-buffer-nums: "$value"
          EOF

            set +e
            sudo ip netns exec cli "$HEV_BIN" "$config" > "$log" 2>&1
            status=$?
            set -e

            if [[ "$status" -eq 0 ]] || ! grep -q "Invalid udp-copy-buffer-nums" "$log"; then
              echo "$label was not rejected by config validation" >&2
              cat "$log"
              FAILURES+=("$label validation failed")
            fi
          }

          check_invalid_udp_copy_buffer_count 0
          check_invalid_udp_copy_buffer_count -1
          check_invalid_udp_copy_buffer_count 65
          check_invalid_udp_copy_buffer_count 99999999999999999999999999
          check_invalid_udp_copy_buffer_count 1x

          run_case udp-copy-buffer-1 0 1 1 1 0 64 0 1
          run_case udp-copy-buffer-64 0 1 1 1 0 64 0 64
          run_case udp-datagram-1746 0 1 1 1 0 64 0 10 2000 1746
          run_case udp-datagram-1747-truncated 0 1 0 1 0 64 0 10 2000 1747 1 1
          run_case unlimited-small 0 16 16
          run_case session-limit-1 1 1 1
          run_case session-limit-2 2 2 2
          run_case session-limit-130 130 130 130
          run_case udp-queue-512-boundary 0 1 512 640 0 1024 0
          if ! grep -q "WP6_UDP_QUEUE_DROP frames=512 limit=512" \
            "$ROOT/logs/udp-queue-512-boundary-hev.log"; then
            echo "queue boundary probe did not observe the 512-frame drop guard" >&2
            FAILURES+=("UDP queue boundary instrumentation not observed")
          fi
          run_case udp-high-flow-1025 0 1025 1025

          {
            echo ""
            echo "### Interpretation"
            echo "- Session cap cases record the current source behavior: configured N permits up to N surviving sessions; excess sessions are evicted."
            echo "- The queue case submits 640 datagrams in one burst through one UDP flow; the WP6 test build raises TUN_READ_BATCH to let the per-session queue reach its configured boundary."
            echo "- UDP copy-buffer counts 1 and 64 are accepted; zero, negative, oversized, overflow, and malformed values are rejected before tunnel initialization."
            echo "- IPv4 SOCKS5 UDP payload 1,746 bytes fits the 1,756-byte receive slot including the 10-byte SOCKS5 UDP header; 1,747 bytes is expected to be dropped as MSG_TRUNC."
            echo "- The 1,025-flow case is a high-flow smoke measurement; lwIP uses heap-backed UDP PCBs (MEMP_MEM_MALLOC=1), so MEMP_NUM_UDP_PCB is not a hard cap in this build."
          } >> "$GITHUB_STEP_SUMMARY"

          cp -a "$ROOT/logs/." "$ARTIFACT_DIR/"

          if [[ ${#FAILURES[@]} -gt 0 ]]; then
            printf '%s\n' "${FAILURES[@]}"
            printf '%s\n' "${FAILURES[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload WP6 measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relayvpn-wp6-hev-udp-boundary-results
          path: phase-wp6-hev-artifacts/
          if-no-files-found: warn
          retention-days: 30
