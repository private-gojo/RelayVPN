name: Phase 2d - BDP-aware TCP windows

on:
  push:
    branches:
      - phase2d/tcp-window-bdp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-window-bdp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RelayVPN
        uses: actions/checkout@v4
      - name: Install build and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake iproute2 curl openssh-client openssh-server python3
      - name: Configure BadVPN and Hev
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/relayvpn-phase2d-build" \
            -G "Unix Makefiles" \
            -DBUILD_NOTHING_BY_DEFAULT=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_TUN2SOCKS=ON \
            -DBUILD_UDPGW=ON \
            -DBUILD_HEV=ON
      - name: Build engines and regression tests
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/relayvpn-phase2d-build" --parallel 2
          test -x "$RUNNER_TEMP/relayvpn-phase2d-build/tun2socks/badvpn-tun2socks"
          test -x third_party/hev-socks5-tunnel/bin/hev-socks5-tunnel
      - name: Validate TCP window configuration
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/relayvpn-phase2d-build/tests/tcp_window_config_test"
          "$RUNNER_TEMP/relayvpn-phase2d-build/tests/tcp_ring_buffer_test"
      - name: Benchmark at controlled RTT
        shell: bash
        run: |
          set -euo pipefail
          RELAYVPN_BDP_BENCHMARK=1 \
          RELAYVPN_BUILD_DIR="$RUNNER_TEMP/relayvpn-phase2d-build" \
          RELAYVPN_BENCHMARK_ROOT="$RUNNER_TEMP/phase2d" \
          RELAYVPN_BENCHMARK_ARTIFACT_DIR="$GITHUB_WORKSPACE/phase2d-artifacts" \
          bash tests/engine-baseline.sh
      - name: Upload BDP benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relayvpn-phase2d-tcp-window-bdp
          path: phase2d-artifacts/
          if-no-files-found: warn
