name: Phase 2b - Hev-inspired TCP buffer primitives

on:
  push:
    branches:
      - phase2b/hev-inspired-tcp
      - phase2b/tcp-to-socks-ring
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-ring-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RelayVPN
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Configure BadVPN and Hev targets
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/relayvpn-phase2b-build" \
            -G "Unix Makefiles" \
            -DBUILD_NOTHING_BY_DEFAULT=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_TUN2SOCKS=ON \
            -DBUILD_UDPGW=ON \
            -DBUILD_HEV=ON
      - name: Build regression and engine targets
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/relayvpn-phase2b-build" \
            --target tcp_ring_buffer_test chunkbuffer2_test bproto_test badvpn-tun2socks hev-bin \
            --parallel 2
      - name: Run focused buffer and existing unit tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/relayvpn-phase2b-build/tests/tcp_ring_buffer_test"
          "$RUNNER_TEMP/relayvpn-phase2b-build/tests/chunkbuffer2_test"
          "$RUNNER_TEMP/relayvpn-phase2b-build/tests/bproto_test"
